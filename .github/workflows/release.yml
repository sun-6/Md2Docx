name: Release

# 推送 v* 标签时自动构建发布包并创建 GitHub Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# runner 控制台代码页非 UTF-8，构建脚本的中文/emoji 输出会触发
# UnicodeEncodeError——强制 Python UTF-8 模式
env:
  PYTHONUTF8: "1"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: 安装 uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --locked --all-extras --dev

      - name: 下载 pandoc
        shell: pwsh
        run: |
          $url = "https://github.com/jgm/pandoc/releases/download/3.8.2.1/pandoc-3.8.2.1-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile pandoc.zip
          Expand-Archive pandoc.zip -DestinationPath .
          Move-Item pandoc-3.8.2.1\pandoc.exe .

      - name: 下载 typst
        shell: pwsh
        run: |
          $url = "https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile typst.zip
          Expand-Archive typst.zip -DestinationPath .
          $exe = Get-ChildItem -Recurse -Filter typst.exe | Select-Object -First 1
          Move-Item $exe.FullName .

      - name: 安装 Playwright 浏览器
        run: uv run python -m playwright install chromium

      - name: 测试
        run: uv run pytest tests/ -q

      - name: 构建（onedir + onefile）
        run: uv run python build_package.py

      - name: 上传 Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          # 发布物仅单目录版（单文件版不上传）
          files: |
            Md2Docx_Release_Dir_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
