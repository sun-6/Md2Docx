name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]  # 钉 24.04：ubuntu-latest 2026-10-19 迁移 Ubuntu 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6  # Node 24

      - name: 安装 uv
        uses: astral-sh/setup-uv@v8.1.0  # Node 24（官方文档推荐版本）
        with:
          enable-cache: true

      - name: 安装 Python 依赖
        run: uv sync --dev

      - name: 安装 pandoc (Linux)
        # apt 源的 pandoc 过老（2.9.x），与本地/发布包的 3.8.2.1 行为不一致
        # （引用转换、Lua 过滤器依赖 3.x 特性）——统一从官方 Release 安装
        if: runner.os == 'Linux'
        run: |
          curl -sL https://github.com/jgm/pandoc/releases/download/3.8.2.1/pandoc-3.8.2.1-linux-amd64.tar.gz | tar xz
          sudo mv pandoc-3.8.2.1/bin/pandoc /usr/local/bin/pandoc
          pandoc --version | head -1

      - name: 安装 pandoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/jgm/pandoc/releases/download/3.8.2.1/pandoc-3.8.2.1-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile pandoc.zip
          Expand-Archive pandoc.zip -DestinationPath .
          "$env:GITHUB_WORKSPACE\pandoc-3.8.2.1" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 安装 Qt 系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: 安装 typst (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sL https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz | tar xJ
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst

      - name: 安装 typst (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile typst.zip
          Expand-Archive typst.zip -DestinationPath .
          "$env:GITHUB_WORKSPACE\typst-x86_64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 安装 Playwright 浏览器 (Linux)
        if: runner.os == 'Linux'
        run: uv run python -m playwright install --with-deps chromium
        # 浏览器安装失败时渲染类测试经 requires_browser 自动 skip，不阻塞主线
        continue-on-error: true

      - name: 安装 Playwright 浏览器 (Windows)
        if: runner.os == 'Windows'
        run: uv run python -m playwright install chromium
        continue-on-error: true

      - name: Lint (ruff)
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: 验证关键依赖导入
        run: |
          uv run python -c "import playwright.sync_api as m; print('playwright at', m.__file__)"
          uv run python -c "import sys; print('interpreter:', sys.executable)"

      - name: Type check (pyright)
        run: |
          uv run pyright --pythonpath "$(uv run python -c 'import sys; print(sys.executable)')" md2docx_core.py md2docx_cli.py

      - name: 诊断 citations（原生 pandoc 二分）
        # 本地通过而 CI 失败时的定位手段：绕过 Python 直接用 pandoc 跑同一转换。
        # 步骤失败时日志自动展开；转换正常（含交叉引用）则本步骤通过。
        if: always()
        shell: bash
        run: |
          set -x
          which pandoc
          pandoc --version | head -1
          echo "--- 输入指纹（与本地比对）:"
          git config core.autocrlf || true
          git hash-object tests/fixtures/citations_test.md table_filter.lua
          md5sum tests/fixtures/citations_test.md table_filter.lua
          head -c 120 tests/fixtures/citations_test.md | od -c | head -6
          head -c 60 table_filter.lua | od -c | head -3
          pandoc tests/fixtures/citations_test.md -L table_filter.lua --to html5 -M md2docx-citations=true -o diag_raw.html 2> diag_stderr.txt
          echo "--- pandoc stderr（含 MD2DOCX-REF 诊断）:"
          cat diag_stderr.txt
          echo "--- 区域设置:"
          locale 2>/dev/null | head -3 || true
          cmd //c chcp 2>/dev/null || true
          n=$(grep -c md2docx-ref diag_raw.html || true)
          echo "raw pandoc md2docx-ref count: $n"
          export PYTHONIOENCODING=utf-8
          uv run python - <<'PY'
          import md2docx_core as core
          logs = []
          r = core.convert_md_to_format("tests/fixtures/citations_test.md", "html", auto_open=False,
                                        output_file="diag_core.html", log_callback=logs.append)
          print("core ok:", r.ok, "| warnings:", r.warnings)
          for l in logs:
              print("LOG:", l)
          html = open("diag_core.html", encoding="utf-8").read()
          print("core md2docx-ref count:", html.count("md2docx-ref"))
          PY
          test "$n" -gt 0

      - name: 运行测试（含覆盖率）
        run: uv run pytest tests/ -v --cov=md2docx_core --cov=md2docx_cli --cov-report=term

      - name: 上传失败测试调试产物
        if: failure()
        uses: actions/upload-artifact@v6  # Node 24
        with:
          name: test-debug-${{ matrix.os }}
          path: |
            **/*.docx
            **/*.html
          if-no-files-found: ignore
